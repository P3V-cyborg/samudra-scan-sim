<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAMUDRA-SCAN 3D simulation</title>
<style>
:root{--bg:#04141f;--panel:rgba(6,28,42,.82);--ink:#dff3f7;--dim:#7fa9b5;--lo:#3ddc97;--mid:#ffc857;--hi:#ff5a4e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.p{position:absolute;background:var(--panel);border:1px solid #1d4a5c;border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.5}
#hud{top:10px;left:10px;min-width:200px}
#hud h1{font-size:15px;margin:0 0 6px;font-weight:600}
.r{display:flex;justify-content:space-between;gap:12px}
.r b{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:6px;background:#0d2f40;border-radius:3px;margin:2px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lo)}
#ph{color:var(--mid);font-weight:600}
#ctl{bottom:calc(10px + env(safe-area-inset-bottom,0px));left:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
button,select{background:#0d3a4f;color:var(--ink);border:1px solid #2a6a82;border-radius:5px;padding:6px 12px;font:inherit;cursor:pointer}
button:hover{background:#14506c}
#log{top:10px;right:10px;width:230px;max-height:38%;overflow:auto;font-size:12px;color:var(--dim)}
#log div{margin-bottom:3px}
@media(max-width:600px){#log{display:none}}
#tr{bottom:calc(66px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;font-size:12px;padding:6px 8px}
#tr span{padding:2px 9px;border-radius:10px;color:var(--dim)}#tr span.on{background:#14506c;color:var(--ink)}
#ov{display:none;position:absolute;inset:0;background:rgba(2,10,16,.88);align-items:center;justify-content:center;padding:12px}
#ovc{max-width:720px;max-height:88%;overflow:auto;background:var(--panel);border:1px solid #1d4a5c;border-radius:8px;padding:16px;font-size:13.5px;line-height:1.55}
#ovc h2{margin:0 0 6px;font-size:18px}#ovc h3{margin:12px 0 4px;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:12.5px}td,th{border-bottom:1px solid #1d4a5c;padding:5px 6px;text-align:left;vertical-align:top}
#cl,#cl2{color:var(--dim);font-size:12px}#ch{position:static;inset:auto;display:block;width:100%;height:50px;margin:4px 0;background:#03101a;border-radius:4px}
@media(max-width:900px){#tr{display:none}}
</style></head><body>
<div id="hud" class="p"><h1>SAMUDRA-SCAN pod</h1>
<div class="r"><span>Phase</span><span id="ph">Descent</span></div>
<div class="r"><span>Depth</span><b id="dp">0 m</b></div>
<div class="r"><span>EM response</span><b id="em">0</b></div><div class="bar"><i id="emb"></i></div>
<div class="r"><span>Magnetic</span><b id="mg">0</b></div><div class="bar"><i id="mgb"></i></div>
<div class="r"><span>Anomaly score</span><b id="sc">0</b></div><div class="bar"><i id="scb"></i></div>
<div class="r"><span>Rescans</span><b id="rs">0</b></div>
<div class="r"><span>Area covered</span><b id="cm">0%</b></div>
<div class="r"><span>Samples logged</span><b id="smp">0</b></div>
<div id="cl">Classifier: -</div><canvas id="ch" width="200" height="50"></canvas>
<div id="cl2">EM cyan, magnetic violet, score amber</div></div>
<div id="tr" class="p"><span data-k="descent">Descend</span><span data-k="survey">Detect + locate</span><span data-k="rescan">Rescan</span><span data-k="verify">Verify</span><span data-k="recover">Recover + map</span></div>
<div id="ov"><div id="ovc"><div id="ovb"></div><p><button id="ovx">Close</button></p></div></div>
<div id="log" class="p"><div>Drag to orbit, scroll or pinch to zoom.</div></div>
<div id="ctl" class="p">
<button id="rst">Restart</button>
<button id="pz">Pause</button><button id="cmpb">Why it wins</button><button id="repb">Mission report</button>
<label>Speed <select id="sp"><option value="1">1x</option><option value="2" selected>2x</option><option value="4">4x</option></select></label>
<label>Camera <select id="cam"><option value="orbit">Free orbit</option><option value="follow">Follow pod</option><option value="top">Top-down map</option></select></label>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const S=60,H=S/2,DEPTH=5200,Y0=34;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x04141f);scene.fog=new THREE.Fog(0x04141f,30,120);
const cam=new THREE.PerspectiveCamera(50,1,.1,300);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(ren.domElement);
scene.add(new THREE.AmbientLight(0x6fa8bd,.7));
const sun=new THREE.DirectionalLight(0xbfe9ff,.6);sun.position.set(10,40,10);scene.add(sun);

// hidden anomaly field
const Z=[[-15,10,5],[12,-14,4.5],[18,18,4]];
const field=(x,z)=>{let f=0;for(const[a,b,s]of Z)f+=Math.exp(-((x-a)**2+(z-b)**2)/(2*s*s));return Math.min(f,1)};
const rnd=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647})();

// seabed with heatmap texture
const N=128,cv=document.createElement('canvas');cv.width=cv.height=N;const cx=cv.getContext('2d');
const tex=new THREE.CanvasTexture(cv);
function clearMap(){cx.fillStyle='#3b4a4c';cx.fillRect(0,0,N,N);tex.needsUpdate=true}
clearMap();
const geo=new THREE.PlaneGeometry(S,S,60,60);geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position;
for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);pos.setY(i,Math.sin(x*.3)*.12+Math.cos(z*.25)*.12+(rnd()-.5)*.06)}
geo.computeVertexNormals();
scene.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:tex,roughness:1})));
// nodules, denser in anomalies
const NN=900,nod=new THREE.InstancedMesh(new THREE.SphereGeometry(.22,8,6),new THREE.MeshStandardMaterial({color:0x1a1512,roughness:.8}),NN);
const m4=new THREE.Matrix4();
for(let i=0,k=0;k<NN&&i<9000;i++){const x=(rnd()-.5)*S,z=(rnd()-.5)*S;if(rnd()<.06+field(x,z)*.9){const s=.6+rnd()*.8;m4.makeScale(s,s*.7,s);m4.setPosition(x,.08,z);nod.setMatrixAt(k++,m4)}}
scene.add(nod);

// ship + water surface
const ship=new THREE.Group();
const hull=new THREE.Mesh(new THREE.BoxGeometry(10,2,3.5),new THREE.MeshStandardMaterial({color:0xd9e2e6}));
const cab=new THREE.Mesh(new THREE.BoxGeometry(3,2.4,3),new THREE.MeshStandardMaterial({color:0xff7a3c}));cab.position.set(-2.5,2,0);
ship.add(hull,cab);ship.position.set(0,Y0+4,0);scene.add(ship);
const water=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshBasicMaterial({color:0x2b8fb0,transparent:true,opacity:.25,side:THREE.DoubleSide}));
water.rotation.x=-Math.PI/2;water.position.y=Y0+3.2;scene.add(water);

// pod
const pod=new THREE.Group();
const body=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,1.1,16),new THREE.MeshStandardMaterial({color:0xe8c547,metalness:.5,roughness:.4}));
const fl=new THREE.Mesh(new THREE.TorusGeometry(.8,.09,8,20),new THREE.MeshStandardMaterial({color:0xff7a3c}));fl.rotation.x=Math.PI/2;fl.position.y=.6;
const beacon=new THREE.Mesh(new THREE.SphereGeometry(.14,8,8),new THREE.MeshBasicMaterial({color:0xff5a4e}));beacon.position.y=.8;
const coil=new THREE.Mesh(new THREE.TorusGeometry(.42,.05,8,20),new THREE.MeshStandardMaterial({color:0xb87333}));coil.rotation.x=Math.PI/2;coil.position.y=-.6;
const boom=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,1.5,6),new THREE.MeshStandardMaterial({color:0xaaaaaa}));boom.rotation.z=Math.PI/2;boom.position.set(.5,0,0);
const ball=new THREE.Mesh(new THREE.BoxGeometry(.8,.25,.8),new THREE.MeshStandardMaterial({color:0x555555}));ball.position.y=-.85;
const flash=new THREE.PointLight(0xffffff,0,9);flash.position.y=-.7;
pod.add(body,fl,beacon,coil,boom,ball,flash);scene.add(pod);
const sn=new Float32Array(1200);for(let i=0;i<1200;i+=3){sn[i]=(rnd()-.5)*S;sn[i+1]=rnd()*Y0;sn[i+2]=(rnd()-.5)*S}
const snG=new THREE.BufferGeometry();snG.setAttribute('position',new THREE.BufferAttribute(sn,3));
scene.add(new THREE.Points(snG,new THREE.PointsMaterial({color:0xbfe9ff,size:.12,transparent:true,opacity:.5})));
const cone=new THREE.Mesh(new THREE.ConeGeometry(1.6,1.6,20,1,true),new THREE.MeshBasicMaterial({color:0x3ddc97,transparent:true,opacity:.28,side:THREE.DoubleSide,depthWrite:false}));
cone.position.y=-1.3;pod.add(cone);
// USBL ping ring
const ping=new THREE.Mesh(new THREE.RingGeometry(.9,1,32),new THREE.MeshBasicMaterial({color:0x7fe3ff,transparent:true,opacity:.6,side:THREE.DoubleSide}));
scene.add(ping);
// trail
const TM=4000,tp=new Float32Array(TM*3),tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.BufferAttribute(tp,3));tg.setDrawRange(0,0);
scene.add(new THREE.Line(tg,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.5})));
// anomaly markers
const marks=[];

// state
let st,path,pi,tc,pos3,sc,trig,paused=false,tlast=0;
function log(t){const d=document.createElement('div');d.textContent=t;$('log').appendChild(d);$('log').scrollTop=1e5}
function lawn(x0,x1,z0,z1,sp,y){const w=[];let dir=1;for(let z=z0;z<=z1+.01;z+=sp){w.push(dir>0?[x0,z]:[x1,z],dir>0?[x1,z]:[x0,z]);dir=-dir}return w}
function reset(){
  st='descent';pos3=new THREE.Vector3(-24,Y0,-24);sc=0;tc=0;found=[];pathLen=0;samples=0;hist=[];pod.add(ball);ball.position.set(0,-.85,0);$('ov').style.display='none';$('rs').textContent=0;
  path=lawn(-26,26,-26,26,6.5).map(p=>({x:p[0],z:p[1]}));pi=0;
  marks.forEach(m=>scene.remove(m));marks.length=0;
  $('log').innerHTML='';log('Pod released from vessel. Free-fall descent.');
  clearMap();tg.setDrawRange(0,0);cnt=0;
}
let cnt=0,seen=new Set();
function sense(x,z){
  const f=field(x,z),em=Math.max(0,f*.92+(rnd()-.5)*.14),mg=Math.max(0,f*.55+.15*Math.sin(x*.1+z*.07)+(rnd()-.5)*.12);
  return{em,mg,score:Math.min(100,Math.max(0,(.6*em+.4*mg/.7)*100))};
}
function paint(x,z,s){
  const u=(x+H)/S*N,v=(z+H)/S*N,c=s>75?'255,90,78':s>45?'255,200,87':'61,220,151';
  cx.fillStyle=`rgba(${c},.55)`;cx.beginPath();cx.arc(u,v,2.4,0,7);cx.fill();tex.needsUpdate=true;
  seen.add((u|0)*N+(v|0));
}
function setPhase(p,c){$('ph').textContent=p;$('ph').style.color=c||'var(--mid)'}
let vt=0,found=[],pathLen=0,samples=0,hist=[];
function step(dt){
  if(st==='end')return;
  dt*=+$('sp').value;tc+=dt;
  if(st==='descent'){
    pos3.y-=dt*7;pos3.x=-24+Math.sin(tc)*.2;
    if(pos3.y<=1.4){pos3.y=1.4;st='survey';setPhase('Coarse survey');log('Landed. USBL fix from vessel. Coarse survey at ~1 m altitude.')}
  }else if(st==='verify'){
    vt+=dt;flash.intensity=2.5;cone.material.color.set(0xffffff);cone.material.opacity=.2+.25*Math.abs(Math.sin(vt*9));
    if(vt>2.4){const f=found[found.length-1];f.cov=Math.round(30+f.peak*.45+rnd()*8);log(`Camera check at A${found.length}: ~${f.cov}% nodule cover. Confirmed.`);flash.intensity=0;cone.material.opacity=.28;st='survey';setPhase('Coarse survey')}
  }else if(st==='recover'){
    pos3.y+=dt*9;if(pos3.y>Y0){pos3.y=Y0;st='end';setPhase('Recovered','var(--lo)');log('Pod at surface. SD log read out.');showRep()}
  }else{
    const w=path[pi];
    if(!w){st='recover';setPhase('Recovery ascent','var(--lo)');scene.attach(ball);log('Acoustic release fired, ballast dropped. Data is on SD, pod ascending.');return}
    const dx=w.x-pos3.x,dz=w.z-pos3.z,d=Math.hypot(dx,dz),v=(st==='survey'?8:5)*dt;
    if(d<v){pos3.x=w.x;pos3.z=w.z;pi++;pathLen+=d;if(w.end){st='verify';vt=0;setPhase('Camera verify','var(--lo)')}}
    else{pos3.x+=dx/d*v;pos3.z+=dz/d*v;pathLen+=v}
    const r=sense(pos3.x,pos3.z);sc+=(r.score-sc)*Math.min(1,dt*6);samples++;
    paint(pos3.x,pos3.z,sc);hud(r);
    if(st==='rescan'){const f=found[found.length-1];f.peak=Math.max(f.peak,sc)}
    if(st==='survey'&&sc>60&&found.length<3&&found.every(t=>Math.hypot(t.x-pos3.x,t.z-pos3.z)>14)){
      found.push({x:pos3.x,z:pos3.z,peak:sc});st='rescan';setPhase('Adaptive rescan','var(--hi)');
      $('rs').textContent=found.length;log(`Anomaly A${found.length}: score ${sc|0}. Dense local rescan.`);
      const sub=lawn(pos3.x-5,pos3.x+5,pos3.z-5,pos3.z+5,2).map(p=>({x:p[0],z:p[1]}));sub[sub.length-1].end=true;
      path.splice(pi,0,...sub);
      const mk=new THREE.Mesh(new THREE.RingGeometry(5.2,5.5,40),new THREE.MeshBasicMaterial({color:0xff5a4e,side:THREE.DoubleSide}));
      mk.rotation.x=-Math.PI/2;mk.position.set(pos3.x,.3,pos3.z);scene.add(mk);marks.push(mk);
    }
  }
  pod.position.set(pos3.x,pos3.y+.6,pos3.z);
  if(st!=='verify'){cone.material.color.set(sc>75?0xff5a4e:sc>45?0xffc857:0x3ddc97);cone.scale.setScalar(st==='rescan'?.7:1)}
  if((st==='survey'||st==='rescan')&&cnt<TM){tp[cnt*3]=pos3.x;tp[cnt*3+1]=.5;tp[cnt*3+2]=pos3.z;cnt++;tg.setDrawRange(0,cnt);tg.attributes.position.needsUpdate=true}
  const k=Math.min(1,(Y0-pos3.y)/(Y0-1.4));scene.background.setRGB(.01+.05*(1-k),.05+.25*(1-k),.08+.35*(1-k));scene.fog.color.copy(scene.background);
  $('dp').textContent=Math.round(k*DEPTH)+' m';$('cm').textContent=Math.min(100,Math.round(pathLen*3.2/(S*S)*100))+'%';$('smp').textContent=samples;
}
function hud(r){
  $('em').textContent=r.em*100|0;$('mg').textContent=r.mg*100|0;$('sc').textContent=sc|0;
  $('emb').style.width=Math.min(100,r.em*100)+'%';$('mgb').style.width=Math.min(100,r.mg*140)+'%';
  const c=sc>75?'var(--hi)':sc>45?'var(--mid)':'var(--lo)';$('scb').style.width=sc+'%';$('scb').style.background=c;
  const g=(m,q)=>Math.exp(-((sc-m)**2)/q),a=g(15,800),b=g(55,500),h=g(90,500),t=a+b+h;
  $('cl').textContent=`Classifier: Low ${a/t*100|0}%  Med ${b/t*100|0}%  High ${h/t*100|0}%`;
  hist.push([r.em*100,r.mg*140,sc]);if(hist.length>140)hist.shift();
  const x=$('ch').getContext('2d');x.clearRect(0,0,200,50);
  [['#7fe3ff',0],['#c792ea',1],['#ffc857',2]].forEach(([col,i])=>{x.strokeStyle=col;x.beginPath();hist.forEach((q,j)=>{const px=j*200/140,py=50-Math.min(100,q[i])/2;j?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()});
}
function showRep(){
  const sv=Math.round((1-pathLen/1750)*100);
  const rows=found.map((f,i)=>`<tr><td>A${i+1}</td><td>${Math.round(f.x*5)}, ${Math.round(f.z*5)} m</td><td>${f.peak|0}</td><td>~${f.cov||'-'}%</td><td>${f.peak>85?'High':'Medium'}</td></tr>`).join('');
  $('ovb').innerHTML=`<h2>Mission report</h2><p>Survey area 300 x 300 m, ${samples} samples logged. Adaptive scanning used about ${sv}% less track than a uniform dense grid (simulation estimate).</p><table><tr><th>Target</th><th>Offset from drop</th><th>Peak score</th><th>Nodule cover</th><th>Sampling priority</th></tr>${rows||'<tr><td colspan=5>Run the mission to completion.</td></tr>'}</table><p>Simulated sensors, not field data. Scores rank places to sample next; they are not metal grades.</p>`;
  $('ov').style.display='flex';
}
function showCmp(){
  $('ovb').innerHTML=`<h2>Why SAMUDRA-SCAN</h2><p>Detect, locate, rescan, verify, map, at reconnaissance cost.</p><table><tr><th>Approach</th><th>Limit for early detection</th></tr><tr><td>Multibeam / side-scan</td><td>Shape and acoustics only, no direct metal-linked signal</td></tr><tr><td>Camera alone</td><td>Needs clear water, sees the surface only</td></tr><tr><td>Magnetometer alone</td><td>Nodules are weakly magnetic, so anomalies are ambiguous</td></tr><tr><td>AUV or ROV survey</td><td>Costly platform and crew for every survey</td></tr><tr><td><b>SAMUDRA-SCAN</b></td><td><b>Low-cost pod fusing EM and magnetic data, scoring anomalies, rescanning densely only where needed, and using the camera only to verify</b></td></tr></table><h3>Honest limits</h3><p>Reports an anomaly score, not nickel, cobalt or copper grades. A pressure housing rated for about 500 bar is the main cost driver. Position comes from ship USBL plus dead reckoning, since there is no GPS at depth. Data is read from SD after recovery. This page uses simulated sensors.</p>`;
  $('ov').style.display='flex';
}
// camera orbit
let az=.8,el=.6,dist=55,tgt=new THREE.Vector3();
let drag=null,pin=[];
const cv0=ren.domElement;
cv0.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv0.setPointerCapture(e.pointerId)});
cv0.addEventListener('pointerup',()=>drag=null);
cv0.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag.x)*.006;el=Math.max(.05,Math.min(1.5,el+(e.clientY-drag.y)*.006));drag={x:e.clientX,y:e.clientY}});
cv0.addEventListener('wheel',e=>{dist=Math.max(6,Math.min(110,dist*(1+e.deltaY*.001)));e.preventDefault()},{passive:false});
let pd=0;cv0.addEventListener('touchmove',e=>{if(e.touches.length==2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pd)dist=Math.max(6,Math.min(110,dist*pd/d));pd=d}},{passive:true});
cv0.addEventListener('touchend',()=>pd=0);
function camUpdate(){
  const m=$('cam').value;
  if(m==='follow'||(m==='orbit'&&(st==='descent'||st==='recover'))){tgt.lerp(pos3,.08)}
  else if(m==='top'){tgt.lerp(new THREE.Vector3(0,0,0),.1)}
  else tgt.lerp(new THREE.Vector3(0,0,0),.05);
  if(m==='top'){cam.position.set(tgt.x,Math.max(dist,40),tgt.z+.01)}
  else{const d=m==='follow'?Math.min(dist,14):dist;cam.position.set(tgt.x+d*Math.cos(el)*Math.sin(az),tgt.y+d*Math.sin(el),tgt.z+d*Math.cos(el)*Math.cos(az))}
  cam.lookAt(tgt);
}
function size(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
$('rst').onclick=()=>{seen=new Set();reset()};
$('pz').onclick=()=>{paused=!paused;$('pz').textContent=paused?'Resume':'Pause'};
function loop(t){
  const dt=Math.min(.05,(t-tlast)/1000||0);tlast=t;
  if(!paused)step(dt);
  water.position.y=Y0+3.2+Math.sin(t/900)*.08;ship.position.y=Y0+4+Math.sin(t/900)*.08;
  const pr=(t/1200)%1;ping.position.set(0,Y0+3,0);ping.scale.setScalar(1+pr*4);ping.material.opacity=.5*(1-pr);ping.rotation.x=-Math.PI/2;
  ping.visible=st!=='end';for(let i=1;i<1200;i+=3){sn[i]-=.012;if(sn[i]<0)sn[i]=Y0}snG.attributes.position.needsUpdate=true;document.querySelectorAll('#tr span').forEach(e=>e.classList.toggle('on',e.dataset.k===st||(st==='end'&&e.dataset.k==='recover')));
  beacon.material.color.setHex(Math.floor(t/400)%2?0xff5a4e:0x551a16);
  camUpdate();ren.render(scene,cam);requestAnimationFrame(loop);
}
$('cmpb').onclick=showCmp;$('repb').onclick=showRep;$('ovx').onclick=()=>$('ov').style.display='none';
reset();requestAnimationFrame(loop);
</script></body></html>
